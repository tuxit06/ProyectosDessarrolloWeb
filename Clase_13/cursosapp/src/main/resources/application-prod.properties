# ============================================================
# Perfil de produccion (S13: Render.com + Aiven)
# ============================================================
# Se activa poniendo la variable de entorno SPRING_PROFILES_ACTIVE=prod
# en el dashboard de Render (Environment). Con ese profile activo, Spring
# Boot mezcla este archivo SOBRE application.properties - lo que se repite
# aca gana, lo que no se toca (ej. spring.jpa.show-sql) queda como estaba.
#
# Las 3 variables de abajo (DB_URL, DB_USERNAME, DB_PASSWORD) se configuran
# como variables de entorno en Render, NUNCA hardcodeadas aca. Sus valores
# reales salen del panel de conexion del servicio MySQL en Aiven.
# ============================================================

# Aiven da una URL de conexion tipo:
#   mysql://usuario:password@host:puerto/defaultdb?ssl-mode=REQUIRED
# Para Spring hay que armar la URL JDBC a mano con host/puerto/db de Aiven:
#   jdbc:mysql://<host>:<puerto>/defaultdb?sslMode=REQUIRED
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# En Aiven, la tabla NO existe todavia la primera vez - "update" hace que
# Hibernate cree/actualice las tablas solo, igual que en local. Una vez que
# el proyecto este estable, se recomienda pasar a "validate" (Hibernate solo
# revisa que las tablas coincidan, no las modifica) y manejar cambios de
# esquema con migraciones (Flyway/Liquibase) - fuera de alcance de este curso.
spring.jpa.hibernate.ddl-auto=update

# En produccion no hace falta ver cada consulta SQL en el log ni recargar
# plantillas en caliente - esto reduce ruido y mejora un poco el rendimiento.
spring.jpa.show-sql=false
spring.thymeleaf.cache=true

# Render inyecta el puerto real en la variable de entorno PORT. Si no esta
# definida (ej. corriendo este profile en la maquina local por error), cae
# al 8080 de siempre.
server.port=${PORT:8080}
